# Build and test on Linux/ARM64, the second supported platform.
# Runs on a native arm64 runner. The docker/ setup covers the same ground
# locally, from a macOS development machine.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build and test
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # libedit-dev is the line-editing library aforth links (ADR 0001).
      - name: Install clang, make and libedit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang make libedit-dev

      - name: Show toolchain
        run: |
          clang --version
          make --version

      - name: Build
        run: make

      - name: Test
        run: make test
